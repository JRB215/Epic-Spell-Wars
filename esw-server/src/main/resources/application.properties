spring.application.name=epic-spell-wars
server.port=${PORT:8080}
server.compression.enabled=true
spring.main.banner-mode=off

# Folder with card pictures and the leaderboard file. In Docker this is the mounted /custom-assets folder.
esw.assets=${ESW_ASSETS:./assets}
# Speed of the game's animations and pauses. 1.0 is normal, 0 turns pauses off (used by tests).
esw.pace=${ESW_PACE:1.0}
