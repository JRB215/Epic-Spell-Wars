name: Build

# Builds and tests every pull request, and every branch other than main.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run all tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Make sure the Docker image builds (nothing is published from here)
        run: docker build -t epic-spell-wars-server:test .
